.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surface2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;font-size:.8rem;background:rgba(0,0,0,.55);color:#fff}
.thumbs.sm .thumb{width:44px;height:44px;border-radius:8px}
.file-btn{position:relative;overflow:hidden;height:64px}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.d-note{background:var(--r)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:9px;fill:var(--muted)}
.plan-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.plan-item:first-of-type{border-top:0}
.shop-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.shop-row.done .nm{text-decoration:line-through;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:4px}
.links{display:flex;gap:6px 14px;flex-wrap:wrap;margin:0}
.links a{color:var(--leaf-t);font-weight:700;text-decoration:none}
.likes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.likes button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:800;color:var(--muted)}
.likes button span{font-size:1.5rem}
.likes button.on{border-color:var(--leaf);background:var(--leaf-soft);color:var(--ink)}
.urgent{background:var(--berry);color:#fff;border-radius:12px;padding:10px 12px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}
details.card summary{cursor:pointer;font-family:var(--f-display);font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
details.card[open] summary::after{content:"–"}
details.card[open] summary{margin-bottom:10px}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.report{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--fs-cap);white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:12px;max-height:280px;overflow:auto;border:0;width:100%;min-height:200px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

soft:{r:0,s:['Пюре или намачкано с вилица.','Меки пръчици колкото пръст или кубчета 1–2 см; може и намачкано с бучки.','Малки парченца като за семейството.'],h:'Мекият сготвен зеленчук е с нисък риск.'},

function pairFit(ids){

  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){total++;if(P[ps[i]].p.includes(ps[j])||P[ps[j]].p.includes(ps[i]))good++}

}

function counts(list){

let MODE='loading',DB=null;
const LS_KEY='purvi-hapki-v1';
const queues={};
function writeDoc(path,data){
  if(MODE==='db'){
    const q=queues[path]||(queues[path]={busy:false,next:undefined});
    q.next=data===null?{__del:1}:clone(data);
    if(!q.busy)flush(path);
  } else lsSave();
}
async function flush(path){
  const q=queues[path];q.busy=true;
  while(q.next!==undefined){
    const d=q.next;q.next=undefined;
    try{ if(d.__del) await DB.doc(path).delete(); else await DB.doc(path).set(d); }
    catch(e){
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));if(q.next===undefined)q.next=d;continue}
      if(e&&e.code==='quota_exceeded')toast('Хранилището е пълно – изтрий стари записи.');
      else if(e&&e.code==='invalid_argument')toast('Нямаш права да записваш. Помоли собственика да те добави като Editor.');
      else toast('Записът не успя. Опитай отново.');
    }
  }
  q.busy=false;
}

function autoTrend(){
  const t=today();let hard=0,loose=0,any=0,mealDays=0;
  for(let i=0;i<3;i++){const d=S.days[addDays(t,-i)];if(!d)continue;(d.stools||[]).forEach(s=>{any++;if(s.c==='hard')hard++;if(s.c==='watery')loose++});if((d.meals||[]).length)mealDays++}
  if(hard&&hard>=loose)return {k:'constip',why:'твърди изхождания през последните 3 дни'};
  if(loose>=2)return {k:'loose',why:'рядко изхождане през последните 3 дни'};
  if(!any&&mealDays>=3)return {k:'constip',why:'няма отбелязано изхождане от 3 дни'};
  return {k:'normal',why:any?'изхождането изглежда нормално':'няма достатъчно записи за изхождане'};
}
const curTrend=()=>UI.trend==='auto'?autoTrend().k:UI.trend;
function absTags(ps){
  const t=[];const has=f=>ps.some(p=>p.f.includes(f));
  if(has('F')&&has('C'))t.push('Желязо + витамин C');
  if(has('A')&&has('O'))t.push('Витамин A + мазнина');
  if(ps.some(p=>p.g===5)&&ps.some(p=>p.g!==5&&p.f.includes('F')))t.push('Месото помага за растителното желязо');
  return t;
}
function absWarn(ps){
  if(ps.some(p=>p.g===4)&&ps.some(p=>p.f.includes('F')&&(p.g===5||p.g===3||p.c==='grain')))return 'Млечното намалява усвояването на желязото – по-добре в отделно хранене.';
  return '';
}
function evalCombo(ids){
  const ps=ids.map(i=>P[i]).filter(Boolean);const sts=ps.map(p=>st(p.id));
  return {ps,sts,nNew:ps.filter((p,i)=>!sts[i]&&p.c!=='herb').length,react:sts.includes('react'),dis:sts.includes('dislike'),age:Math.max(...ps.map(p=>p.a)),eff:ps.reduce((a,p)=>a+(EF[p.e]||0),0),abs:absTags(ps),warn:absWarn(ps)};
}
function scoreCombo(ev){
  const tr=curTrend(),age=ageM();let s=ev.abs.length;
  if(tr==='constip')s+=ev.eff*2;else if(tr==='loose')s-=ev.eff*2;else s-=Math.abs(ev.eff)*.5;
  if(age!=null&&ev.age>age)s-=10;
  const I=idx();ev.ps.forEach(p=>{const o=I[p.id];if(o&&o.likes.length){const avg=o.likes.reduce((a,b)=>a+b,0)/o.likes.length;s+=(avg-1.5)*.4}});
  return s;
}
function rankedCombos(mode){

function checklistText(){

function growthChart(kind){
  const list=growthSorted().filter(g=>{const a=ageMoAt(g.date);return g[kind]&&a!=null&&a>=0&&a<=24.5});
  const age=Math.max(0,ageMoAt(today())||0);
  const lastMo=Math.max(age,...list.map(g=>ageMoAt(g.date)));
  const xMax=Math.min(24,Math.max(12,Math.ceil(lastMo+2)));
  const zs=[-1.881,-1.036,0,1.036,1.881],lab=['3','15','50','85','97'];
  const W=340,H=230,pl=28,pr=22,pt=10,pb=28,step=kind==='w'?1:5;
  let lo=valZ(kind,0,-2.2),hi=valZ(kind,xMax,2.2);list.forEach(g=>{lo=Math.min(lo,g[kind]);hi=Math.max(hi,g[kind])});
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const X=m=>pl+m/xMax*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=(z,from,to,dir)=>{let s='';for(let m=from;dir>0?m<=to+1e-9:m>=to-1e-9;m+=0.25*dir)s+=(s||dir<0?'L':'M')+X(m).toFixed(1)+' '+Y(valZ(kind,m,z)).toFixed(1);return s};
  const band=path(1.036,0,xMax,1)+path(-1.036,xMax,0,-1)+'Z';
  let grid='';
  for(let v=lo;v<=hi+1e-9;v+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="0.6"/><text x="${pl-4}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`;
  const xs=xMax>12?3:2;for(let m=0;m<=xMax;m+=xs)grid+=`<line x1="${X(m).toFixed(1)}" x2="${X(m).toFixed(1)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-width="0.6"/><text x="${X(m).toFixed(1)}" y="${H-pb+12}" text-anchor="middle">${m}</text>`;
  const curves=zs.map((z,i)=>`<path d="${path(z,0,xMax,1)}" fill="none" stroke="${z===0?'var(--leaf)':'var(--muted)'}" stroke-width="${z===0?1.6:0.9}"${Math.abs(z)>1.5?' stroke-dasharray="3 3"':''} opacity="${z===0?1:0.75}"/><text x="${W-pr+3}" y="${(Y(valZ(kind,xMax,z))+3).toFixed(1)}">${lab[i]}</text>`).join('');
  const pts=list.map(g=>[X(ageMoAt(g.date)),Y(g[kind])]);
  const line=pts.length>1?`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="var(--apricot)" stroke-width="1.8"/>`:'';
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="var(--apricot)" stroke="var(--surface)" stroke-width="1.5"/>`).join('');
  const nowL=age<=xMax?`<line x1="${X(age).toFixed(1)}" x2="${X(age).toFixed(1)}" y1="${pt}" y2="${H-pb}" stroke="var(--apricot)" stroke-width="0.8" stroke-dasharray="2 3"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind==='w'?'Тегло':'Ръст'} спрямо кривите на СЗО"><path d="${band}" fill="var(--leaf-soft)"/>${grid}${curves}${nowL}${line}${dots}<text x="${((pl+W-pr)/2).toFixed(0)}" y="${H-3}" text-anchor="middle">възраст (месеци) · ${kind==='w'?'тегло в кг':'ръст в см'}</text></svg>`;
}

function gcal(title,details,date,time,daily){
  const [hh,mm]=(time||'09:00').split(':').map(Number);const s=parseD(date);s.setHours(hh,mm,0,0);const e=new Date(s.getTime()+15*60000);
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&details='+encodeURIComponent(details)+'&dates='+f(s)+'/'+f(e)+'&ctz=Europe/Sofia';
  if(daily)u+='&recur='+encodeURIComponent('RRULE:FREQ=DAILY');
  return u;
}

function reportText(){
  const p=S.profile;const a=ageOf(p.birth);const I=idx();const L=[];
  L.push('ДНЕВНИК ЗА ЗАХРАНВАНЕ'+(p.name?' – '+p.name:''));
  if(a)L.push(`Възраст: ${a.m} м ${a.d} д`);
  if(p.start)L.push('Начало на захранването: '+fmtD(p.start));
  L.push('Кърмене: '+(p.bf?'да':'не'));
  const c=counts();L.push(`Въведени продукти: ${c.intro} от ${c.total}`);L.push('');
  const by=s=>PLIST.filter(x=>st(x.id)===s);
  const line=x=>{const o=I[x.id];return '- '+x.n+(o?` (от ${fmtD(o.first)}, ${o.n} хранения)`:'')};
  const ok=PLIST.filter(x=>isIntro(st(x.id)));
  L.push('ВЪВЕДЕНИ:');Object.keys(CATS).forEach(k=>{const l=ok.filter(x=>x.c===k);if(l.length)L.push(CATS[k]+': '+l.map(x=>x.n).join(', '))});L.push('');
  if(by('trial').length){L.push('В ИЗПИТВАНЕ:');by('trial').forEach(x=>L.push(line(x)));L.push('')}
  if(by('dislike').length){L.push('НЕ ХАРЕСВА:');by('dislike').forEach(x=>L.push(line(x)));L.push('')}
  L.push('РЕАКЦИИ:');let any=false;
  Object.keys(S.days).sort().forEach(d=>(S.days[d].meals||[]).forEach(m=>{if(m.react&&m.react.length){any=true;L.push(`- ${fmtD(d)}, ${SLOT_NAME[m.slot]||''}: ${m.react.map(r=>SYM[r]||r).join(', ')} след ${[...new Set(mealPids(m))].map(pName).join(', ')}${m.rnote?' – '+m.rnote:''}`)}}));
  if(!any)L.push('- няма');
  if(by('react').length)L.push('Спрени заради реакция: '+by('react').map(x=>x.n).join(', '));
  L.push('');L.push('АЛЕРГЕНИ:');
  allergenStatus().forEach(a=>L.push(`- ${a.n}: ${a.react?'реакция':a.intro?(a.last?'въведен, последно '+fmtD(a.last):'въведен'):a.trial?'в изпитване':'не е въведен'}`));
  const gl=growthSorted();
  if(gl.length){L.push('');L.push('РАСТЕЖ (перцентил по СЗО):');gl.slice(-6).forEach(g=>{const ew=g.w?gEval('w',ageMoAt(g.date),g.w):null,el=g.l?gEval('l',ageMoAt(g.date),g.l):null;
    L.push(`- ${fmtD(g.date)}: `+[g.w?`${g.w} кг${ew?' ('+pFmt(ew.p)+'-и)':''}`:'',g.l?`${g.l} см${el?' ('+pFmt(el.p)+'-и)':''}`:''].filter(Boolean).join(', '))})}
  const notes=Object.keys(S.days).sort().filter(d=>d>=addDays(today(),-30)&&hasNote(S.days[d]));
  if(notes.length){L.push('');L.push('БЕЛЕЖКИ (последните 30 дни):');notes.forEach(d=>{const n=S.days[d].note;L.push(`- ${fmtD(d)}: ${(n.tags||[]).map(t=>NOTE_NAME[t]||t).join(', ')}${n.text?((n.tags||[]).length?' – ':'')+n.text:''}`)})}
  return L.join('\n');
}

function saveMeal(){

    if(ps.length===1&&!it.n){items.push({p:ps[0],g:gr(it.g)});return}

  const meal={id:d.id,slot:d.slot,time:d.time||'',items,like:d.like,react:d.react.slice(),rnote:d.react.length?(d.rnote||''):'',note:d.note||'',rAck:d.react.length?!!d.rAck:false,tex:d.tex||'',photos:(d.photos||[]).slice()};

  const day=ensureDay(date);day.meals=day.meals||[];day.meals.push(meal);
  // Хранене за минал ден без реакция: продуктите вече са яли – отбелязват се като въведени
  let changed=recipeAdded,newNames=[],okNames=[];const past=date<today()&&!meal.react.length;

    case 'add-stool':stoolSheet(b.dataset.d||today());break;
    case 'stool':stoolSheet(b.dataset.d,b.dataset.s);break;
    case 'prod':productSheet(b.dataset.p);break;
    case 'quick':{const s=st(b.dataset.p);if(isIntro(s))delete S.prod.st[b.dataset.p];else S.prod.st[b.dataset.p]={...(S.prod.st[b.dataset.p]||{}),s:'ok'};bump();saveProd();render();break}
    case 'st':{const id=b.dataset.p;setStatus(id,v);if(!$('#sheet').hidden&&$('#sheet-title').textContent===P[id].n)productSheet(id);toast(v==='ok'?P[id].n+' – въведен':v==='trial'?'Започна изпитване':v==='react'?'Отбелязана реакция':v==='dislike'?'Отбелязано':'Статусът е нулиран');break}
    case 'react-mark':{const day=S.days[b.dataset.d];const m=day&&day.meals.find(x=>x.id===b.dataset.m);S.prod.st[b.dataset.p]={...(S.prod.st[b.dataset.p]||{}),s:'react'};if(m)m.rAck=true;bump();saveProd();saveDay(b.dataset.d);render();toast('Продуктът е спрян');break}
    case 'react-ack':{const day=S.days[b.dataset.d];const m=day&&day.meals.find(x=>x.id===b.dataset.m);if(m){m.rAck=true;bump();saveDay(b.dataset.d);render()}break}
    case 'pf':UI.pf=v;render();break;
    case 'pcat':UI.pc=UI.pc===v?'':v;UI.q='';render();break;
    case 'psub':UI.psub=v;render();window.scrollTo(0,0);break;
    case 'intro-meal':closeSheet();mealSheet(today(),null,[{p:b.dataset.p,g:''}]);break;
    case 'ck-copy':{const txt=checklistText();
      try{await navigator.clipboard.writeText(txt);toast('Списъкът е копиран')}catch(err){openSheet('Списък с продукти',`<textarea class="report" readonly>${h(txt)}</textarea><p class="small muted" style="margin:0">Задръж върху текста, за да го копираш.</p>`)}break}
    case 'cm':UI.cm=v;render();break;
    case 'trend':UI.trend=v;render();break;
    case 'sel':UI.sel=v;UI.cal=v.slice(0,7);render();break;
    case 'cal':{const [y,m]=UI.cal.split('-').map(Number);const d=new Date(y,m-1+(+v),1);UI.cal=d.getFullYear()+'-'+pad(d.getMonth()+1);render();break}
    case 'add-custom':customSheet();break;
    case 'save-custom':{const n=$('#c-name').value.trim();if(!n){toast('Въведи име');return}
      const f=($('#c-fe').checked?'F':'')+($('#c-al').checked?'L':'');
      S.prod.custom=S.prod.custom||[];S.prod.custom.push({id:'c_'+uid(),n,c:$('#c-cat').value,a:+$('#c-age').value||6,e:$('#c-eff').value,g:+$('#c-grp').value,f});
      bump();saveProd();closeSheet();render();toast('Продуктът е добавен');break}
    case 'del-custom':{const id=b.dataset.p;S.prod.custom=(S.prod.custom||[]).filter(c=>c.id!==id);delete S.prod.st[id];bump();saveProd();closeSheet();render();break}
    case 'save-profile':{const p=S.profile;p.name=$('#pf-name').value.trim();p.sex=$('#pf-sex').value==='m'?'m':'f';p.birth=$('#pf-birth').value;p.start=$('#pf-start').value;p.bf=$('#pf-bf').checked;
      p.times=p.times||{};document.querySelectorAll('[id^="tm-"]').forEach(i=>{p.times[i.id.slice(3)]=i.value});bump();saveProfile();render();toast('Профилът е запазен');break}
    case 'copy-report':{const ta=$('#report');try{await navigator.clipboard.writeText(ta.value);toast('Копирано')}catch(err){ta.focus();ta.select();toast('Маркирано – копирай ръчно')}break}
    case 'export':{
      const data={app:'parvi-hapki',v:2,profile:S.profile,prod:S.prod,days:S.days,growth:S.growth,plan:S.plan,freezer:S.freezer};
      const withPh=$('#exp-photos')&&$('#exp-photos').checked;
      if(withPh){b.textContent='Подготвям…';try{data.photos=await LocalPhotos.exportAll()}catch(err){toast('Снимките не можаха да се добавят')}}
      try{const r=await saveFile('parvi-hapki-'+today()+'.json',JSON.stringify(data));
        if(r){try{localStorage.setItem('ph-backup',today())}catch(err){}toast(r==='shared'?'Избери къде да запазиш копието':'Копието е изтеглено');render()}}
      catch(err){toast(err&&err.code==='unavailable'?'Изтеглянето не е налично тук':'Изтеглянето не успя')}
      break}
    case 'share-app':{const url=new URL('../',location.href).href;const data={title:'Първи хапки',text:'Безплатен дневник за захранване на бебе по насоките на СЗО',url};
      if(navigator.share){try{await navigator.share(data)}catch(err){}break}
      try{await navigator.clipboard.writeText(url);toast('Линкът е копиран')}catch(err){toast(url)}break}
    case 'import':$('#import-file').click();break;
    case 'import-yes':applyImport();break;
    case 'import-no':pendingImport=null;$('#import-confirm').innerHTML='';break;
    case 'm-slot':syncDraftInputs();draft.slot=v;renderMealSheet();break;
    case 'm-add':{const p=b.dataset.p;
      if(draft._recipe){syncBuilder();if(!draft.ps.includes(p))draft.ps.push(p);draft._q='';renderBuilder();break}
      syncDraftInputs();const t=draft.items[draft._t];
      if(t&&t.ps){if(!t.ps.includes(p))t.ps.push(p)}else draft.items.push({p,g:''});
      draft._q='';renderMealSheet();break}
    case 'm-rm':{syncDraftInputs();const i=+b.dataset.i;draft.items.splice(i,1);if(draft._t===i)draft._t=-1;else if(draft._t>i)draft._t--;renderMealSheet();break}
    case 'm-newdish':syncDraftInputs();draft.items.push({n:'',ps:[],g:'',save:false});draft._t=draft.items.length-1;renderMealSheet();break;
    case 'm-target':{syncDraftInputs();const i=+b.dataset.i;draft._t=draft._t===i?-1:i;renderMealSheet();break}
    case 'm-rmc':{syncDraftInputs();const it=draft.items[+b.dataset.i];if(it&&it.ps)it.ps.splice(+b.dataset.j,1);renderMealSheet();break}
    case 'm-recipe':{syncDraftInputs();const r=recipes().find(x=>x.id===b.dataset.r);if(r)draft.items.push({n:r.n||'',ps:r.ps.slice(),g:'',rid:r.id});draft._t=-1;renderMealSheet();break}
    case 'combo-meal':{const ids=b.dataset.ids.split(' ').filter(i=>P[i]);const r=recipes().find(x=>comboKey(x.ps)===comboKey(ids));
      closeSheet();mealSheet(today(),null,[{n:b.dataset.n||'',ps:ids,g:'',rid:r?r.id:undefined,save:false}]);break}
    case 'combo-save':{const ids=b.dataset.ids.split(' ').filter(i=>P[i]);if(!recipes().some(r=>comboKey(r.ps)===comboKey(ids))){S.prod.recipes=recipes().concat({id:'r_'+uid(),n:b.dataset.n||'',ps:ids});bump();saveProd()}
      if(!$('#sheet').hidden&&draft==null){const t=$('#sheet-title').textContent;const p=PLIST.find(x=>x.n===t);if(p)productSheet(p.id)}render();toast('Запазено в „Моите пюрета“');break}
    case 'recipe-new':recipeSheet();break;
    case 'recipe-edit':recipeSheet(b.dataset.r);break;
    case 'r-rmc':syncBuilder();draft.ps.splice(+b.dataset.j,1);renderBuilder();break;
    case 'b-slot':syncBuilder();draft.slot=v;renderBuilder();break;
    case 'b-quick':syncBuilder();draft.ps=b.dataset.ids.split(' ').filter(i=>P[i]);if(!draft.n)draft.n=b.dataset.n||'';renderBuilder();break;
    case 'r-save':{syncBuilder();const d=draft;const n=(d.n||'').trim();
      if(d._mode==='plan'||d._mode==='freezer'){
        if(!d.ps.length){toast('Избери поне 1 продукт');return}
        if(d._mode==='plan'){S.plan.days=S.plan.days||{};(S.plan.days[d.date]=S.plan.days[d.date]||[]).push({id:d.id,slot:d.slot,n,ps:d.ps.slice()});bump();savePlan();closeSheet();render();toast('Добавено в менюто')}
        else{const rec={id:d.id,n,ps:d.ps.slice(),por:Math.max(1,parseInt(d.por,10)||1),size:Math.max(0,parseInt(d.size,10)||0),date:d.date||today()};S.freezer.items=(S.freezer.items||[]).filter(x=>x.id!==d.id).concat(rec);bump();saveFreezer();closeSheet();render();toast('Записано във фризера')}
        break}
      if(d.ps.length<2){toast('Избери поне 2 продукта');return}
      const list=recipes().filter(x=>x.id!==d.id);if(list.some(r=>comboKey(r.ps)===comboKey(d.ps))){toast('Това пюре вече е запазено');return}
      const old=recipes().findIndex(x=>x.id===d.id);const rec={id:d.id,n,ps:d.ps.slice()};
      if(old>=0){const arr=recipes().slice();arr[old]=rec;S.prod.recipes=arr}else S.prod.recipes=list.concat(rec);
      bump();saveProd();closeSheet();render();toast('Пюрето е запазено');break}
    case 'r-del':{if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Потвърди изтриването';return}
      if(draft._mode==='freezer'){S.freezer.items=(S.freezer.items||[]).filter(x=>x.id!==draft.id);bump();saveFreezer();closeSheet();render();toast('Премахнато от фризера');break}
      S.prod.recipes=recipes().filter(x=>x.id!==draft.id);bump();saveProd();closeSheet();render();toast('Пюрето е изтрито');break}
    case 'go':UI.tab=v;if(b.dataset.s){if(v==='combos')UI.csub=b.dataset.s;if(v==='calendar')UI.calsub=b.dataset.s;if(v==='products')UI.psub=b.dataset.s}saveUI();render();window.scrollTo(0,0);break;
    case 'csub':UI.csub=v;render();break;
    case 'calsub':UI.calsub=v;render();break;
    case 'gk':UI.gk=v;render();break;
    case 'week':UI.week=addDays(UI.week,+v);render();break;
    case 'plan-add':builderSheet('plan',{date:b.dataset.d,slot:planFor(b.dataset.d).some(e=>e.slot==='lunch')?'breakfast':'lunch'});break;
    case 'plan-rm':{const d=b.dataset.d;S.plan.days[d]=planFor(d).filter(e=>e.id!==b.dataset.e);bump();savePlan();render();break}
    case 'plan-eat':{const d=b.dataset.d;const e=planFor(d).find(x=>x.id===b.dataset.e);if(e)mealSheet(d,null,dishPreset(e),e.slot);break}
    case 'plan-auto':autoFill();break;
    case 'plan-clear':{if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Потвърди';return}
      for(let i=0;i<7;i++)delete S.plan.days[addDays(UI.week,i)];bump();savePlan();render();toast('Седмицата е изчистена');break}
    case 'shop':{S.plan.shop=S.plan.shop||{};const w=S.plan.shop[UI.week]||(S.plan.shop[UI.week]={});if(w[b.dataset.p])delete w[b.dataset.p];else w[b.dataset.p]=1;bump();savePlan();render();break}
    case 'shop-copy':{const txt=shopText([...Array(7)].map((_,i)=>addDays(UI.week,i)));
      try{await navigator.clipboard.writeText(txt);toast('Списъкът е копиран')}catch(err){openSheet('Списък за пазаруване',`<textarea class="report" readonly>${h(txt)}</textarea><p class="small muted" style="margin:0">Задръж върху текста, за да го копираш.</p>`)}break}
    case 'fz-add':builderSheet('freezer');break;
    case 'fz-edit':{const x=(S.freezer.items||[]).find(i=>i.id===b.dataset.f);if(x)builderSheet('freezer',{...x,_edit:true});break}
    case 'fz-use':{const x=(S.freezer.items||[]).find(i=>i.id===b.dataset.f);if(!x)break;
      x.por=(+x.por||1)-1;if(x.por<=0)S.freezer.items=S.freezer.items.filter(i=>i.id!==x.id);bump();saveFreezer();render();
      mealSheet(today(),null,dishPreset(x,x.size));toast(x.por>0?`Остават ${x.por} порции`:'Това беше последната порция');break}
    case 'add-growth':growthSheet();break;
    case 'growth':growthSheet(b.dataset.id);break;
    case 'g-save':{const num=id=>{const s=$(id).value.trim().replace(',','.');return s?parseFloat(s):null};const w=num('#g-w'),l=num('#g-l');
      if(w==null&&l==null){toast('Въведи тегло или ръст');return}
      if(w!=null&&!(w>=1&&w<=30)){toast('Теглото трябва да е в килограми, напр. 7,45');return}
      if(l!=null&&!(l>=40&&l<=120)){toast('Ръстът трябва да е в сантиметри, напр. 67,5');return}
      const rec={id:draft.id,date:$('#g-date').value||today(),note:$('#g-note').value.trim()};if(w!=null)rec.w=Math.round(w*1000)/1000;if(l!=null)rec.l=Math.round(l*10)/10;
      S.growth.list=(S.growth.list||[]).filter(x=>x.id!==rec.id).concat(rec);bump();saveGrowth();closeSheet();render();toast('Измерването е записано');break}
    case 'g-del':{if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Потвърди изтриването';return}
      S.growth.list=(S.growth.list||[]).filter(x=>x.id!==draft.id);bump();saveGrowth();closeSheet();render();break}
    case 'note':noteSheet(b.dataset.d);break;
    case 'n-tag':draft.text=$('#n-text').value;draft.tags=draft.tags.includes(v)?draft.tags.filter(x=>x!==v):draft.tags.concat(v);renderNoteSheet();break;
    case 'n-save':{const d=draft;d.text=$('#n-text').value.trim();const day=ensureDay(d._date);
      if(!d.tags.length&&!d.text)delete day.note;else day.note={tags:d.tags.slice(),text:d.text};bump();saveDay(d._date);closeSheet();render();toast('Бележката е записана');break}
    case 'n-del':{const day=S.days[draft._date];if(day){delete day.note;bump();saveDay(draft._date)}closeSheet();render();break}
    case 'm-tex':syncDraftInputs();draft.tex=draft.tex===v?'':v;renderMealSheet();break;
    case 'm-rmph':{syncDraftInputs();const id=draft.photos[+b.dataset.i];draft.photos.splice(+b.dataset.i,1);
      if((draft._newPhotos||[]).includes(id)){draft._newPhotos=draft._newPhotos.filter(x=>x!==id);if(ASSETS)ASSETS.delete(id).catch(()=>{})}else draft._delPhotos=(draft._delPhotos||[]).concat(id);
      renderMealSheet();break}
    case 'm-like':syncDraftInputs();draft.like=draft.like===+v?null:+v;renderMealSheet();break;
    case 'm-noreact':syncDraftInputs();draft.react=[];draft._rx=false;renderMealSheet();break;
    case 'app-reload':location.reload();break;
    case 'sum':UI.sumOpen=!UI.sumOpen;render();break;
    case 'ps-tab':productSheet(PS.id,v);$('#sheet-body').scrollTop=0;break;
    case 'onb-next':syncOnb();if(ONB.step<2){ONB.step++;render();window.scrollTo(0,0)}else finishOnb();break;
    case 'onb-back':syncOnb();ONB.step=Math.max(0,ONB.step-1);render();break;
    case 'onb-skip':S.profile.onb=1;ONB=null;bump();saveProfile();render();break;
    case 'onb-pick':{syncOnb();const p=b.dataset.p;ONB.picked=ONB.picked.includes(p)?ONB.picked.filter(x=>x!==p):ONB.picked.concat(p);render();break}
    case 'hide-install':try{localStorage.setItem('ph-hide-install',today())}catch(err){}render();toast('Скрито за 30 дни');break;
    case 'm-rx':syncDraftInputs();draft._rx=true;renderMealSheet();break;
    case 'm-when':syncDraftInputs();draft._when=!draft._when;renderMealSheet();break;
    case 'm-g':{syncDraftInputs();const it=draft.items[+b.dataset.i];if(it){it.g=+it.g===+v?'':v;renderMealSheet()}break}
    case 'm-react':syncDraftInputs();draft.react=draft.react.includes(v)?draft.react.filter(x=>x!==v):draft.react.concat(v);draft.rAck=false;renderMealSheet();break;
    case 'm-save':saveMeal();break;
    case 'm-del':{const d=draft;if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Потвърди изтриването';return}
      const day=S.days[d._orig];if(day){day.meals=day.meals.filter(x=>x.id!==d.id);bump();saveDay(d._orig)}
      if(ASSETS)(d.photos||[]).concat(d._delPhotos||[]).forEach(id=>ASSETS.delete(id).catch(()=>{}));d._saved=true;
      closeSheet();render();toast('Изтрито');break}
    case 's-c':syncStool();draft.c=v;renderStoolSheet();break;
    case 's-col':syncStool();draft.col=v;renderStoolSheet();break;
    case 's-save':saveStool();break;
    case 's-del':{const d=draft;if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Потвърди изтриването';return}
      const day=S.days[d._orig];if(day){day.stools=(day.stools||[]).filter(x=>x.id!==d.id);bump();saveDay(d._orig)}closeSheet();render();toast('Изтрито');break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='p-search'){UI.q=t.value;const pos=t.selectionStart;render();const n=$('#p-search');n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}return}
  if(t.id==='m-q'&&draft){draft._q=t.value;renderPick();return}
  if(t.dataset.gi!=null&&draft){draft.items[+t.dataset.gi].g=t.value;return}
  if(t.dataset.dn!=null&&draft){draft.items[+t.dataset.dn].n=t.value;return}
  if(t.dataset.act==='time'){S.profile.times=S.profile.times||{};S.profile.times[t.dataset.k]=t.value;const a=t.parentElement.querySelector('a');const k=t.dataset.k;const n=t.parentElement.querySelector('span').textContent;a.href=gcal(k==='check'?'Първи хапки: отбележи изхождане и реакции':'Първи хапки: '+n,'Отвори дневника и запиши храненето.',today(),t.value,true)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='mark-mode'){UI.mark=e.target.checked;render()}
  if(e.target.id==='trend-sel'){UI.trend=e.target.value;render()}
  if(e.target.dataset.ds!=null&&draft&&draft.items){draft.items[+e.target.dataset.ds].save=e.target.checked}
  if(e.target.id==='m-photo'&&draft&&ASSETS){
    const f=e.target.files[0];if(!f)return;const dr=draft;syncDraftInputs();dr._uploading=true;renderMealSheet();
    (async()=>{
      try{const blob=await compressImage(f);const type=/^image\/(jpeg|png|webp|gif)$/.test(blob.type)?blob.type:'image/jpeg';
        const r=await ASSETS.upload(blob,{type});dr.photos=(dr.photos||[]).concat(r.id);dr._newPhotos=(dr._newPhotos||[]).concat(r.id)}
      catch(err){toast(err&&err.code==='too_large'?'Снимката е твърде голяма':err&&err.code==='quota_or_state'?'Няма място за още снимки':'Снимката не се качи')}
      finally{dr._uploading=false;if(draft===dr){syncDraftInputs();renderMealSheet()}}
    })();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

let pendingImport=null;
$('#import-file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=='parvi-hapki')throw 0;pendingImport=d;
    const n=Object.keys(d.days||{}).length;
    $('#import-confirm').innerHTML=`<div class="alert a-react" style="margin-top:10px"><div>Файлът съдържа <b>${n}</b> дни записи. Възстановяването ще <b>замени</b> всички сегашни данни.</div><div class="row"><button class="btn sm danger" data-act="import-yes">Замени данните</button><button class="btn sm" data-act="import-no">Откажи</button></div></div>`;
  }catch(err){toast('Файлът не е копие от Първи хапки')}
});
async function applyImport(){
  const d=pendingImport;if(!d)return;pendingImport=null;
  if(d.photos&&MODE==='local'&&ASSETS){try{await LocalPhotos.importAll(d.photos)}catch(e){toast('Част от снимките не се възстановиха')}}
  const old=Object.keys(S.days);
  S.profile=Object.assign(defProfile(),d.profile||{});S.prod=Object.assign({st:{},custom:[]},d.prod||{});S.days=d.days||{};
  S.growth=Object.assign({list:[]},d.growth||{});S.plan=Object.assign({days:{},shop:{}},d.plan||{});S.freezer=Object.assign({items:[]},d.freezer||{});
  buildProducts();bump();
  if(MODE==='db'){saveProfile();writeDoc('app/products',S.prod);saveGrowth();writeDoc('app/plan',S.plan);saveFreezer();old.forEach(k=>{if(!S.days[k])writeDoc('days/'+k,null)});Object.keys(S.days).forEach(k=>writeDoc('days/'+k,S.days[k]))}else lsSave();
  render();toast('Данните са възстановени');
}

init();
</script>
