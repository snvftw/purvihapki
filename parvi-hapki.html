body:`<p>СЗО съветва захранването да започне на 6 месеца<sup>[1]</sup>. Кърменето продължава до 2 години и повече<sup>[1]</sup>.</p>
<h3>Колко пъти на ден</h3>
<ul><li>6–8 месеца: 2–3 хранения на ден<sup>[2]</sup>.</li>
<li>9–23 месеца: 3–4 хранения на ден и 1–2 междинни закуски, ако бебето иска<sup>[2]</sup>.</li></ul>
<p>Започни с малки количества и увеличавай постепенно<sup>[2]</sup>.</p>
<h3>Консистенция</h3>
<ul><li>От 6 месеца – пюрета, намачкани и полутвърди храни.</li>
<li>Към 8 месеца повечето бебета могат да ядат и парченца, които хващат сами.</li>
<li>Към 12 месеца повечето деца ядат същите храни като семейството<sup>[3]</sup>.</li></ul>
<h3>Какво да има в чинията</h3>
<ul><li>Всеки ден храни от животински произход: месо, риба или яйца<sup>[1]</sup>.</li>
<li>Всеки ден плодове и зеленчуци<sup>[1]</sup>.</li>
<li>Често бобови, ядки и семена – особено когато месото, рибата, яйцата и зеленчуците са малко<sup>[1]</sup>.</li></ul>
<p>Добра мярка за разнообразие е поне 5 от 8 групи храни на ден<sup>[4]</sup>. Групите са: кърма; зърнени храни, корени и грудки; бобови, ядки и семена; млечни продукти; месо, риба и карантии; яйца; плодове и зеленчуци с много витамин А; други плодове и зеленчуци.</p>
<h3>Какво да няма</h3>
<p>Храни с много захар, сол и трансмазнини не се дават<sup>[1]</sup>. Подсладени напитки и подсладители – също не. Плодовите сокове, дори 100%, се ограничават<sup>[1]</sup>. На практика: не добавяй сол и захар в храната на бебето.</p>
<h3>Хранене според сигналите</h3>
<p>Следи кога бебето е гладно и кога е сито<sup>[2]</sup>. Храни спокойно и търпеливо. Насърчавай, но не насилвай.</p>
<p>„Първи хапки“ следва насоките на СЗО, но не е свързано със СЗО.</p>`,

{k:'allergens',t:'Ранно въвеждане на алергени (LEAP и EAT)',
sum:['Ранното и редовно даване на фъстъци и яйце намалява риска от алергия към тях.',
'В LEAP защитата от фъстъци се запазва и след година пауза, и до 12-годишна възраст.',
'Бебе с тежка екзема или вече известна алергия? Първо говори с педиатъра.',
'Започни с малко, у дома, а после давай редовно – поне веднъж седмично.'],
body:`<p>Дълго време се смяташе, че алергените трябва да се отлагат. Големи проучвания показаха, че ранното и редовно даване може да предпази.</p>
<h3>LEAP</h3>
<p>Участват 640 бебета на възраст от 4 до 11 месеца с тежка екзема, алергия към яйце или и двете<sup>[1]</sup>. Едната група яде фъстъци до 5 години – поне 6 г фъстъчен протеин седмично, в 3 или повече хранения. Другата ги избягва. При бебетата с отрицателен кожен тест в началото алергията към фъстъци на 5 години е 13,7% при избягване и 1,9% при ядене. При положителен тест – 35,3% срещу 10,6%<sup>[1]</sup>.</p>
<p>След това всички спират фъстъците за 12 месеца. Защитата остава: на 6 години 18,6% срещу 4,8%<sup>[2]</sup>. На 12 години – 15,4% срещу 4,4%, около 70% по-малко алергия<sup>[3]</sup>.</p>
<h3>EAT</h3>
<p>Участват 1303 кърмени бебета от общото население<sup>[4]</sup>. Шест алергена се въвеждат от 3 месеца, но много семейства не успяват да спазят плана. Затова в основния анализ разликата не е значима: 7,1% срещу 5,6%. При бебетата, които спазват плана, алергиите са по-малко: към фъстъци 0% срещу 2,5%, към яйце 1,4% срещу 5,5%<sup>[4]</sup>.</p>
<h3>Какво казват насоките</h3>
<p>EAACI съветва добре сготвено яйце като част от захранването – не сурово и не пастьоризирано без готвене. Където алергията към фъстъци е честа – и фъстъци във форма, подходяща за възрастта<sup>[5]</sup>. Насоките на NIAID (САЩ) съветват бебета с тежка екзема и/или алергия към яйце да получат фъстъци още на 4–6 месеца, след преглед при лекар – насоките съветват преди това и изследване<sup>[6]</sup>. В „Първи хапки“ алергените се въвеждат от 6 месеца.</p>
<h3>Как на практика</h3>
<ul><li>Фъстък: гладко фъстъчено масло, разредено в каша. Никога цели ядки или парчета<sup>[7]</sup>.</li>
<li>Яйце: само добре сготвено. Много педиатри започват с жълтъка, после цяло яйце.</li>
<li>Първия път – малко количество, смесено с храна, която бебето вече яде<sup>[7]</sup>. Сутрин, у дома, когато бебето е здраво.</li>
<li>Наблюдавай 2 часа – алергичните реакции обикновено идват за минути до 2 часа<sup>[7]</sup>.</li>
<li>Без реакция? Продължавай редовно – поне веднъж седмично<sup>[7]</sup>.</li></ul>`,

{k:'onenew',t:'Един нов продукт на 3 дни – откъде идва правилото',
sum:['„Един нов продукт на 3 дни“ е практика на педиатрите, не изискване на СЗО.',
'Целта е при реакция да се разбере коя храна е причината.',
'Алергичните реакции обикновено идват до 2 часа, а при FPIES повръщането е след 1–4 часа.',
'В приложението изпитването започва само, а на 3-тия ден идва напомняне.'],
body:`<p>Правилото „един нов продукт на 3 дни“ е практика на педиатрите. То не е изискване на СЗО. Насоките на СЗО наблягат на разнообразна храна всеки ден<sup>[1]</sup>.</p>
<h3>Защо се прави</h3>
<p>Ако има реакция, лесно се разбира коя храна е причината. Затова в едно хранене се дава само една нова храна, а алергените се въвеждат един по един<sup>[2]</sup>.</p>
<h3>Кога идват реакциите</h3>
<ul><li>Алергичните реакции (обрив, подуване, повръщане) обикновено идват бързо – за минути до 2 часа<sup>[2]</sup>.</li>
<li>FPIES е рядка, забавена алергия на червата. Бебето повръща многократно около 1–4 часа след храната, често е бледо и отпаднало<sup>[3]</sup>.</li>
<li>Други реакции идват по-бавно – след часове, понякога дни<sup>[2]</sup><sup>[4]</sup>. Например обостряне на екзема или промени в изхождането.</li></ul>
<p>Трите дни дават време да се забележат и по-бавните признаци.</p>
<h3>Как на практика</h3>
<ul><li>Ден 1: 1–2 лъжички сутрин или по обед. Така имаш целия ден да наблюдаваш бебето.</li>
<li>Новата храна може да се смеси с вече въведена, например с пюре от зеленчук, който бебето яде<sup>[2]</sup>.</li>
<li>Дни 2 и 3: давай отново, по малко повече.</li>
<li>3 дни без реакция – продуктът е въведен.</li></ul>
<p>В приложението изпитването започва само при първото хранене с нов продукт. На 3-тия ден идва напомняне да провериш и да маркираш продукта като въведен.</p>
<h3>Не отлагай излишно</h3>
<p>Ако бебето е здраво и няма реакция, не е нужно да чакаш повече. Целта е до около 12 месеца бебето да яде разнообразно – като останалите в семейството.</p>`,

{k:'rotation',t:'Ротация на храните и алергените',
sum:['Въведените алергени се дават редовно – поне веднъж седмично.',
'Примерен ритъм: яйце през ден, ядки и тахан 2 пъти седмично, риба 1–2 пъти.',
'Редувай зърнените храни – оризовите продукти може да съдържат много неорганичен арсен.',
'„Колко често“ в картата на продукта напомня кога е ред и добавя събитие в календара.'],
body:`<p>След като алергенът е въведен без реакция, той трябва да остане в менюто. ASCIA съветва въведените алергени да се дават поне веднъж седмично<sup>[1]</sup>. Редовното даване помага поносимостта да се запази. В LEAP бебетата ядат фъстъци поне 3 пъти седмично – общо поне 6 г фъстъчен протеин<sup>[2]</sup>.</p>
<h3>Примерен ритъм</h3>
<p>Това е пример, не правило:</p>
<ul><li>Яйце – 2–3 пъти седмично, например през ден.</li>
<li>Фъстък, тахан, ядки – по ½–1 ч.л. гладка паста, 2 пъти седмично. Всяка ядка се въвежда отделно.</li>
<li>Риба – 1–2 пъти седмично.</li>
<li>Кисело мляко – може всеки ден, но в отделно хранене от най-богатото на желязо.</li></ul>
<h3>Зърнени храни – редувай</h3>
<p>Някои оризови храни съдържат много неорганичен арсен. ESPGHAN съветва бебетата да не пият оризови напитки и да ядат различни зърнени храни<sup>[3]</sup>. Редувай ориза с овес, елда, просо, царевица и киноа.</p>
<p>Глутенът (пшеница, грис, ечемик) може да се въведе между 4 и 12 месеца. В първите седмици и през първата година не давай големи количества<sup>[4]</sup>. После го давай редовно.</p>
<h3>Разнообразие всеки ден</h3>
<p>Стреми се към поне 5 от 8-те групи храни на ден<sup>[5]</sup>. Ротацията помага: различни зеленчуци, плодове, зърнени храни и източници на белтък през седмицата.</p>
<h3>„Колко често“ в приложението</h3>
<p>В картата на всеки продукт има раздел „Колко често“. Избери ритъм – всеки ден, през ден, на 3 или 4 дни или веднъж седмично. Когато е ред, продуктът излиза в „Днес“ и в календара. Можеш да добавиш напомняне в Google Календар или в календара на телефона.</p>`,

{k:'reactions',t:'Реакции след храна – как да ги разпознаем',
sum:['Лек обрив само около устата, без други признаци, обикновено не е алергия.',
'Обрив, подуване или повръщане: спри храната, снимай, запиши и се свържи с педиатъра.',
'Затруднено дишане, подут език, бледо и отпуснато бебе – звънни на 112.',
'Давенето, промяната в цвета на изхождането и газовете не са алергия.'],
body:`<p>Повечето промени след нова храна са безобидни. Важно е да познаваш и тревожните признаци.</p>
<h3>Зачервяване около устата</h3>
<p>Лек обрив или зачервяване само около устата, без други признаци, обикновено не е алергична реакция<sup>[1]</sup>. Често се вижда след кисели храни като домат, ягоди и цитруси, където храната е докоснала кожата. Ако се разпространи или има и други признаци – виж по-долу.</p>
<h3>Алергична реакция</h3>
<p>Признаци: надигнат сърбящ обрив (копривна треска), подуване на устните, лицето или очите, повръщане, болки в корема<sup>[2]</sup><sup>[3]</sup>. Обикновено идват за минути до 2 часа<sup>[1]</sup>.</p>
<ul><li>Спри храната и снимай обрива.</li>
<li>Запиши реакцията в приложението.</li>
<li>Свържи се с педиатъра. Не давай храната отново без лекар<sup>[1]</sup>.</li></ul>
<h3>Тежка реакция (анафилаксия) – 112</h3>
<p>Достатъчен е един признак<sup>[2]</sup>: затруднено или шумно дишане; свирене в гърдите или упорита кашлица; подут език или стягане в гърлото; пресипнал глас или плач; бледо и отпуснато бебе.</p>
<p><b>Веднага звънни на 112</b><sup>[2]</sup>. Ако педиатърът е предписал план за действие при алергия, следвай него.</p>
<h3>FPIES</h3>
<p>Бебето повръща многократно около 1–4 часа след храната, често е бледо и отпаднало<sup>[4]</sup>. Обикновено няма обрив. Чести причинители са кравето мляко, соята и зърнените храни – най-често оризът и овесът. По-рядко яйцето и рибата<sup>[4]</sup>. Свържи се веднага с лекар, а при силна отпадналост звънни на 112.</p>
<h3>Екзема и изхождане</h3>
<p>Някои реакции идват след часове или дни<sup>[3]</sup>. Обостряне на екзема, слуз или кръв в изхождането – запиши ги и ги покажи на педиатъра.</p>
<h3>Какво не е алергия</h3>
<ul><li>Давене, избутване с езика и гримаси – бебето се учи да яде.</li>
<li>Нов цвят на изхождането – червено след цвекло, зелено след спанак.</li>
<li>Газове след бобови, зеле или броколи.</li></ul>`,

{k:'iron',t:'Желязото в първата година',
sum:['Запасите от желязо стигат за около 6 месеца, а кърмата има малко желязо.',
'След 6 месеца давай храна, богата на желязо, всеки ден.',
'Витамин C в същото хранене помага; млякото, чаят и какаото пречат.',
'Кравето мляко не е основна напитка преди 12 месеца.'],
body:`<p>Здравото доносено бебе се ражда със запаси от желязо. Те стигат за около първите 6 месеца. Кърмата съдържа малко желязо<sup>[1]</sup>. След 6 месеца около 90% от желязото на кърменото бебе трябва да идва от храната<sup>[2]</sup>. Затова всеки ден трябва да има храна, богата на желязо – месо и/или храни, обогатени с желязо<sup>[2]</sup>.</p>
<h3>Два вида желязо</h3>
<ul><li><b>Хемово</b> – от месо и риба. Усвоява се най-добре. Говеждо, агнешко, пилешко бутче, риба. Черен дроб – най-много веднъж седмично, защото има много витамин А.</li>
<li><b>Нехемово</b> – от растения и яйца. Усвоява се по-слабо. Червена леща, нахут, боб, елда, просо, овес, яйчен жълтък, тахан, спанак.</li></ul>
<p>СЗО съветва месо, риба или яйца всеки ден<sup>[3]</sup>.</p>
<h3>Как да се усвои повече</h3>
<ul><li>Добави витамин C в същото хранене: броколи, червена чушка, домат, киви, ягоди, няколко капки лимон<sup>[1]</sup>.</li>
<li>Малко месо към лещата или боба помага да се усвои повече желязо от тях<sup>[1]</sup>.</li>
<li>Млечните продукти дай в отделно хранене – калцият пречи на усвояването.</li>
<li>Без чай и какао – те също пречат.</li></ul>
<h3>Кравето мляко</h3>
<p>Обикновеното краве мляко не бива да е основна напитка преди 12 месеца<sup>[2]</sup>. То съдържа малко желязо. Малко мляко в каша е добре.</p>
<h3>Кога да говориш с педиатъра</h3>
<p>Бебетата с ниско тегло при раждане имат нужда от добавка с желязо<sup>[1]</sup>. Ако бебето е недоносено, попитай педиатъра. Не давай добавки без лекар.</p>
<p>Когато приложението предлага нова храна, то дава предимство на храните с желязо.</p>`,

{k:'vitd',t:'Витамин D и вода',
sum:['Витамин D е важен за костите, а само кърмата не дава достатъчно и слънцето не е сигурен източник.',
'Насоките посочват 400 IU (10 µg) на ден през първата година, но дозата определя педиатърът.',
'Адаптираното мляко е обогатено с витамин D – попитай педиатъра и не давай две добавки наведнъж.',
'До 6 месеца кърменото бебе няма нужда от вода; после – глътки от открита чаша с храненията, без сокове.'],
body:`<p>Витамин D помага на тялото да усвоява калция и е важен за здравите кости<sup>[1]</sup>.</p>
<h3>Защо капки</h3>
<p>Само кърмата не дава на бебето достатъчно витамин D<sup>[2]</sup>. Слънцето не е сигурен източник и може да увеличи риска от рак на кожата<sup>[2]</sup>. Капките се дават и когато бебето е навън<sup>[3]</sup>.</p>
<h3>Колко и докога</h3>
<p>Насоките на ESPGHAN и AAP посочват 400 IU (10 µg) на ден през първата година<sup>[1]</sup><sup>[2]</sup>. NHS посочва 8,5–10 µg на ден за кърмените бебета от раждането до 1 година – дори ако и майката приема витамин D<sup>[3]</sup>. Дозата и продължителността определя педиатърът. Следвай предписанието му.</p>
<ul><li><b>Адаптирано мляко.</b> То е обогатено с витамин D<sup>[3]</sup>. Според NHS бебе, което пие над 500 мл на ден, не се нуждае от добавка<sup>[3]</sup>. Другите насоки се различават<sup>[1]</sup> – попитай педиатъра.</li>
<li><b>Без двойни дози.</b> Не давай две добавки едновременно, например капки и мултивитамини, без да питаш педиатъра. Твърде много от някои витамини вреди<sup>[3]</sup>.</li></ul>
<h3>Вода до 6 месеца</h3>
<p>Кърменото бебе няма нужда от вода, дори в горещините<sup>[4]</sup>. Кърмата е над 80% вода. Ако бебето изглежда жадно, предложи още кърмене. Водата в тази възраст може да причини диария и недохранване<sup>[4]</sup>. Бебе на адаптирано мляко може да има нужда от глътки преварена и охладена вода в горещо време<sup>[5]</sup>.</p>
<h3>Вода от 6 месеца</h3>
<ul><li>Предлагай глътки вода с храненията<sup>[5]</sup>.</li>
<li>Открита чаша или чаша без клапа учи бебето да отпива и е по-добра за зъбите<sup>[5]</sup>.</li>
<li>След 6 месеца водата от чешмата не е нужно да се преварява, посочва NHS<sup>[5]</sup> – ако е годна за пиене. При съмнение – преварена или бутилирана вода за бебета.</li>

function autoTrend(){
  const t=today();let hard=0,loose=0,any=0,mealDays=0;
  for(let i=0;i<3;i++){const d=S.days[addDays(t,-i)];if(!d)continue;(d.stools||[]).forEach(s=>{any++;if(s.c==='hard')hard++;if(s.c==='watery')loose++});if((d.meals||[]).length)mealDays++}
  if(hard&&hard>=loose)return {k:'constip',why:'твърди изхождания през последните 3 дни'};
  if(loose>=2)return {k:'loose',why:'рядко изхождане през последните 3 дни'};
  if(!any&&mealDays>=3)return {k:'constip',why:'няма отбелязано изхождане от 3 дни'};
  return {k:'normal',why:any?'изхождането изглежда нормално':'няма достатъчно записи за изхождане'};
}

function scoreCombo(ev){

  if(tr==='constip')s+=ev.eff*2;else if(tr==='loose')s-=ev.eff*2;else s-=Math.abs(ev.eff)*.5;
  if(age!=null&&ev.age>age)s-=10;

}

// Растеж по СЗО: LMS → z-оценка → перцентил
const ageMoAt=d=>S.profile.birth?dayDiff(S.profile.birth,d)/30.4375:null;
function lmsAt(kind,mo){const t=WHOT[S.profile.sex==='m'?'m':'f'][kind];const x=Math.max(0,Math.min(24,mo));const i=Math.min(23,Math.floor(x)),f=x-i;return t[i].map((v,k)=>v+(t[i+1][k]-v)*f)}
function zScore(kind,mo,x){const [L,M,Sd]=lmsAt(kind,mo);return Math.abs(L)<1e-6?Math.log(x/M)/Sd:(Math.pow(x/M,L)-1)/(L*Sd)}
function valZ(kind,mo,z){const [L,M,Sd]=lmsAt(kind,mo);return Math.abs(L)<1e-6?M*Math.exp(Sd*z):M*Math.pow(1+L*Sd*z,1/L)}
function ncdf(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const pFmt=p=>p<1?'<1':p>99?'>99':String(Math.round(p));
function gEval(kind,mo,x){
  if(mo==null||!x||mo<0||mo>24.5)return null;
  const z=zScore(kind,mo,x),p=ncdf(z)*100;
  const band=kind==='w'?(z<-3?'силно поднормено':z<-2?'поднормено':z>2?'над нормата':'в нормата'):(z<-3?'силно изоставане':z<-2?'изоставане':z>3?'много висок':'в нормата');
  return {z,p,band,cls:band==='в нормата'?'t-ok':Math.abs(z)>3?'t-react':'t-trial'};
}

  const za=gEval('w',ageMoAt(a.date),a.w),zb=gEval('w',ageMoAt(b.date),b.w);

function rankNew(known,started,date){
  const age=ageAtM(date);const tr=curTrend();
  let ironN=0;const groups=new Set();
  known.forEach(i=>{const p=P[i];if(!p)return;if(p.f.includes('F'))ironN++;if(p.g)groups.add(p.g)});
  const res=[];
  PLIST.forEach(p=>{
    if(p.custom||!p.g||started.has(p.id)||(age!=null&&p.a>age))return;
    const i=FIRST30.indexOf(p.id);const why=[];
    // Планът се следва по ред; отклонения – при липса на желязо, алерген твърде рано, запек/рядко изхождане
    let s=i>=0?100-i*3:10-(p.a-6);
    if(i>=0)why.push(`Стъпка ${i+1} от плана „Първите 30“`);
    if(p.f.includes('F')){if(!ironN&&known.size>=3)s+=30;if(ironN<3)why.push('Богат на желязо – след 6 месеца кърмата не покрива нуждите')}
    if(p.f.includes('L')){if(known.size<3)s-=40;else why.push('Алерген – ранното въвеждане намалява риска от алергия')}
    if(p.id==='egg'&&!known.has('egg_yolk'))s-=15;
    if(tr==='constip'){if(p.e==='z')s-=30;if(p.e==='r'){s+=10;why.push('Разхлабващ – добър избор при твърдо изхождане')}}
    if(tr==='loose'){if(p.e==='r')s-=30;if(p.e==='z'){s+=10;why.push('Запичащ – добър избор при рядко изхождане')}}
    if(!groups.has(p.g)&&known.size>=2){if(i<0)s+=8;why.push(`Нова група: „${GROUPS[p.g]}“`)}
    const kp=(PART[p.id]||[]).filter(x=>known.has(x)&&P[x].c!=='herb');
    s+=i<0?Math.min(4,kp.length)*2:Math.min(3,kp.length)*.5;
    if(kp.length)why.push('Отива си с: '+kp.slice(0,3).map(x=>pName(x).toLowerCase()).join(', '));
    res.push({id:p.id,s,why});
  });
  return res.sort((a,b)=>b.s-a.s);
}

function foodQueue(){
  const key=ver+'|'+curTrend()+'|'+today();if(_fqK===key)return _fq;
  const known=new Set(PLIST.filter(p=>isIntro(st(p.id))).map(p=>p.id));
  const started=new Set(Object.keys(S.prod.st).filter(k=>S.prod.st[k]&&S.prod.st[k].s));
  const tri=trialInfo();const act=tri.filter(t=>!t.reacted&&t.day<=3);
  tri.forEach(t=>{if(!t.reacted)known.add(t.id)});
  let d=act.length?addDays(act.map(t=>t.d0||today()).sort().pop(),3):today();if(d<today())d=today();
  const q=[];let guard=0;
  while(q.length<40&&guard++<80){
    const r=rankNew(known,started,d);
    if(!r.length){if(!S.profile.birth||(ageAtM(d)||0)>=12)break;d=addDays(d,7);continue}
    const x=r[0];q.push({id:x.id,date:d,why:x.why,alts:q.length?null:r.slice(1,3).map(y=>y.id)});

}

function autoFill(){

async function compressImage(file){

    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);

    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82));
  }catch(e){return file}

// Самостоятелен режим (без Claude): снимки в IndexedDB на телефона
const LocalPhotos={db:null,urls:{},
  async init(){
    if(!window.indexedDB)return false;
    this.db=await new Promise((res,rej)=>{const r=indexedDB.open('parvi-hapki-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
    (await this._all()).forEach(([k,b])=>{this.urls[k]=URL.createObjectURL(b)});
    return true;
  },
  _st(mode){return this.db.transaction('p',mode).objectStore('p')},
  _all(){return new Promise((res,rej)=>{const out=[];const rq=this._st('readonly').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})},
  _put(id,blob){return new Promise((res,rej)=>{const rq=this._st('readwrite').put(blob,id);rq.onsuccess=()=>{if(this.urls[id])URL.revokeObjectURL(this.urls[id]);this.urls[id]=URL.createObjectURL(blob);res({id})};rq.onerror=()=>rej({code:'quota_or_state'})})},
  upload(blob){return this._put('ph_'+uid(),blob)},
  delete(id){return new Promise(res=>{try{const rq=this._st('readwrite').delete(id);rq.onsuccess=()=>{if(this.urls[id]){URL.revokeObjectURL(this.urls[id]);delete this.urls[id]}res({deleted:true})};rq.onerror=()=>res({deleted:false})}catch(e){res({deleted:false})}})},
  async exportAll(){
    const out={};const toData=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error);fr.readAsDataURL(b)});
    for(const [k,b] of await this._all())out[k]=await toData(b);
    return out;
  },
  async importAll(map){for(const [k,url] of Object.entries(map||{})){const b=await (await fetch(url)).blob();await this._put(k,b)}}
};

const IN_CLAUDE=!!window.claude;
// Нова версия на сайта (само самостоятелното приложение): сравнява своя номер с version.json
let NEWVER=false;
async function checkVersion(){
  if(IN_CLAUDE||!window.PH_VERSION||NEWVER||navigator.onLine===false)return;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    if(j&&j.v&&j.v!==window.PH_VERSION){NEWVER=true;render()}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion()});
addEventListener('online',()=>checkVersion());
setInterval(checkVersion,30*60*1000);
const updateBar=()=>NEWVER?'<div class="update-bar" role="status"><span><b>Има нова версия</b> на приложението.</span><button class="btn sm primary" data-act="app-reload">Обнови</button></div>':'';
const isHomeScreen=()=>window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
async function saveFile(name,text,type){
  let dl=null;try{dl=window.claude&&await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:name,data:text});return 'saved'}catch(e){if(e&&e.code==='declined')return null;throw e}}
  if(IN_CLAUDE)throw {code:'unavailable'};
  const file=new File([text],name,{type:type||'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return 'shared'}catch(e){if(e&&e.name==='AbortError')return null}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return 'saved';
}

function growthChart(kind){
  const list=growthSorted().filter(g=>{const a=ageMoAt(g.date);return g[kind]&&a!=null&&a>=0&&a<=24.5});
  const age=Math.max(0,ageMoAt(today())||0);
  const lastMo=Math.max(age,...list.map(g=>ageMoAt(g.date)));
  const xMax=Math.min(24,Math.max(12,Math.ceil(lastMo+2)));
  const zs=[-1.881,-1.036,0,1.036,1.881],lab=['3','15','50','85','97'];
  const W=340,H=230,pl=28,pr=22,pt=10,pb=28,step=kind==='w'?1:5;
  let lo=valZ(kind,0,-2.2),hi=valZ(kind,xMax,2.2);list.forEach(g=>{lo=Math.min(lo,g[kind]);hi=Math.max(hi,g[kind])});
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const X=m=>pl+m/xMax*(W-pl-pr),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const path=(z,from,to,dir)=>{let s='';for(let m=from;dir>0?m<=to+1e-9:m>=to-1e-9;m+=0.25*dir)s+=(s||dir<0?'L':'M')+X(m).toFixed(1)+' '+Y(valZ(kind,m,z)).toFixed(1);return s};
  const band=path(1.036,0,xMax,1)+path(-1.036,xMax,0,-1)+'Z';
  let grid='';
  for(let v=lo;v<=hi+1e-9;v+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="0.6"/><text x="${pl-4}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${v}</text>`;
  const xs=xMax>12?3:2;for(let m=0;m<=xMax;m+=xs)grid+=`<line x1="${X(m).toFixed(1)}" x2="${X(m).toFixed(1)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)" stroke-width="0.6"/><text x="${X(m).toFixed(1)}" y="${H-pb+12}" text-anchor="middle">${m}</text>`;
  const curves=zs.map((z,i)=>`<path d="${path(z,0,xMax,1)}" fill="none" stroke="${z===0?'var(--leaf)':'var(--muted)'}" stroke-width="${z===0?1.6:0.9}"${Math.abs(z)>1.5?' stroke-dasharray="3 3"':''} opacity="${z===0?1:0.75}"/><text x="${W-pr+3}" y="${(Y(valZ(kind,xMax,z))+3).toFixed(1)}">${lab[i]}</text>`).join('');
  const pts=list.map(g=>[X(ageMoAt(g.date)),Y(g[kind])]);
  const line=pts.length>1?`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('')}" fill="none" stroke="var(--apricot)" stroke-width="1.8"/>`:'';
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="var(--apricot)" stroke="var(--surface)" stroke-width="1.5"/>`).join('');
  const nowL=age<=xMax?`<line x1="${X(age).toFixed(1)}" x2="${X(age).toFixed(1)}" y1="${pt}" y2="${H-pb}" stroke="var(--apricot)" stroke-width="0.8" stroke-dasharray="2 3"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${kind==='w'?'Тегло':'Ръст'} спрямо кривите на СЗО"><path d="${band}" fill="var(--leaf-soft)"/>${grid}${curves}${nowL}${line}${dots}<text x="${((pl+W-pr)/2).toFixed(0)}" y="${H-3}" text-anchor="middle">възраст (месеци) · ${kind==='w'?'тегло в кг':'ръст в см'}</text></svg>`;

  Object.keys(S.days).sort().forEach(d=>(S.days[d].meals||[]).forEach(m=>{if(m.react&&m.react.length){any=true;L.push(`- ${fmtD(d)}, ${SLOT_NAME[m.slot]||''}: ${m.react.map(r=>SYM[r]||r).join(', ')} след ${[...new Set(mealPids(m))].map(pName).join(', ')}${m.rnote?' – '+m.rnote:''}`)}}));
  if(!any)L.push('- няма');
  if(by('react').length)L.push('Спрени заради реакция: '+by('react').map(x=>x.n).join(', '));
  L.push('');L.push('АЛЕРГЕНИ:');
  allergenStatus().forEach(a=>L.push(`- ${a.n}: ${a.react?'реакция':a.intro?(a.last?'въведен, последно '+fmtD(a.last):'въведен'):a.trial?'в изпитване':'не е въведен'}`));
  const gl=growthSorted();
  if(gl.length){L.push('');L.push('РАСТЕЖ (перцентил по СЗО):');gl.slice(-6).forEach(g=>{const ew=g.w?gEval('w',ageMoAt(g.date),g.w):null,el=g.l?gEval('l',ageMoAt(g.date),g.l):null;
    L.push(`- ${fmtD(g.date)}: `+[g.w?`${g.w} кг${ew?' ('+pFmt(ew.p)+'-и)':''}`:'',g.l?`${g.l} см${el?' ('+pFmt(el.p)+'-и)':''}`:''].filter(Boolean).join(', '))})}
  const notes=Object.keys(S.days).sort().filter(d=>d>=addDays(today(),-30)&&hasNote(S.days[d]));
  if(notes.length){L.push('');L.push('БЕЛЕЖКИ (последните 30 дни):');notes.forEach(d=>{const n=S.days[d].note;L.push(`- ${fmtD(d)}: ${(n.tags||[]).map(t=>NOTE_NAME[t]||t).join(', ')}${n.text?((n.tags||[]).length?' – ':'')+n.text:''}`)})}
  return L.join('\n');
}

    case 'close':closeSheet();break;
    case 'tab':UI.tab=v;saveUI();render();window.scrollTo(0,0);break;
    case 'add-meal':mealSheet(b.dataset.d||today());break;
    case 'meal':mealSheet(b.dataset.d,b.dataset.m);break;
    case 'add-stool':stoolSheet(b.dataset.d||today());break;
    case 'stool':stoolSheet(b.dataset.d,b.dataset.s);break;
    case 'prod':productSheet(b.dataset.p);break;
    case 'quick':{const id=b.dataset.p;const o=S.prod.st[id];
      // Махането на отметката пази деня на изпитването (d0), за да не изчезне „нов“ от дневника при случайно двойно докосване
      if(isIntro(st(id))){if(o&&o.d0)S.prod.st[id]={d0:o.d0};else delete S.prod.st[id]}else S.prod.st[id]={...(o||{}),s:'ok'};
      bump();saveProd();render();break}
    case 'st':{const id=b.dataset.p;setStatus(id,v);if(!$('#sheet').hidden&&$('#sheet-title').textContent===P[id].n)productSheet(id);toast(v==='ok'?P[id].n+' – въведен':v==='trial'?'Започна изпитване':v==='react'?'Отбелязана реакция':v==='dislike'?'Отбелязано':'Статусът е нулиран');break}
    case 'react-mark':{const day=S.days[b.dataset.d];const m=day&&day.meals.find(x=>x.id===b.dataset.m);S.prod.st[b.dataset.p]={...(S.prod.st[b.dataset.p]||{}),s:'react'};if(m)m.rAck=true;bump();saveProd();saveDay(b.dataset.d);render();toast('Продуктът е спрян');break}
    case 'react-ack':{const day=S.days[b.dataset.d];const m=day&&day.meals.find(x=>x.id===b.dataset.m);if(m){m.rAck=true;bump();saveDay(b.dataset.d);render()}break}
    case 'pf':UI.pf=v;render();break;
    case 'pa':UI.pa=v;render();break;
    case 'pcat':UI.pc=UI.pc===v?'':v;UI.q='';render();break;
    case 'psub':UI.psub=v;render();window.scrollTo(0,0);break;
    case 'intro-meal':closeSheet();mealSheet(today(),null,[{p:b.dataset.p,g:''}]);break;
    case 'style':S.profile.style=v==='pieces'?'pieces':'puree';bump();saveProfile();render();break;
    case 'daily':{const d=b.dataset.d||today();const k=b.dataset.k;const day=ensureDay(d);const x={...(day.daily||{})};
      if(x[k])delete x[k];else x[k]=1;if(Object.keys(x).length)day.daily=x;else delete day.daily;bump();saveDay(d);render();break}
    case 'freq':{const id=b.dataset.p;const n=+v;S.prod.freq={...freqs()};if(n)S.prod.freq[id]=n;else delete S.prod.freq[id];
      bump();saveProd();render();productSheet(id);toast(n?`${P[id].n} – ${freqName(n)}`:'Напомнянето е спряно');break}
    case 'freq-ics':{const id=b.dataset.p;if(!freqInfo(id))break;
      try{const r=await saveFile('parvi-hapki-'+id+'.ics',freqIcs(id),'text/calendar');if(r)toast(r==='shared'?'Избери „Календар“, за да го добавиш':'Отвори файла, за да го добавиш в календара')}
      catch(err){toast(err&&err.code==='unavailable'?'Изтеглянето не е налично тук':'Файлът не се създаде')}break}
    case 'art':articleSheet(v);break;

    case 'save-profile':{const p=S.profile;p.name=$('#pf-name').value.trim();p.sex=$('#pf-sex').value==='m'?'m':'f';p.birth=$('#pf-birth').value;p.start=$('#pf-start').value;p.bf=$('#pf-bf').checked;p.vitd=$('#pf-vitd').checked;p.water=$('#pf-water').checked;p.style=$('#pf-style').value==='pieces'?'pieces':'puree';syncKid();
      p.times=p.times||{};document.querySelectorAll('[id^="tm-"]').forEach(i=>{p.times[i.id.slice(3)]=i.value});bump();saveProfile();render();toast('Профилът е запазен');break}

    case 'share-app':{const url=new URL('../',location.href).href;const data={title:'Първи хапки',text:'Безплатен дневник за захранване на бебе по насоките на СЗО',url};

    case 'combo-save':{const ids=b.dataset.ids.split(' ').filter(i=>P[i]);if(!recipes().some(r=>comboKey(r.ps)===comboKey(ids))){S.prod.recipes=recipes().concat({id:'r_'+uid(),n:b.dataset.n||'',ps:ids});bump();saveProd()}

        else{const rec={id:d.id,n,ps:d.ps.slice(),por:Math.max(1,parseInt(d.por,10)||1),size:Math.max(0,parseInt(d.size,10)||0),date:d.date||today()};S.freezer.items=(S.freezer.items||[]).filter(x=>x.id!==d.id).concat(rec);bump();saveFreezer();closeSheet();render();toast('Записано във фризера')}

    case 'm-when':syncDraftInputs();draft._when=!draft._when;renderMealSheet();break;
    case 'm-g':{syncDraftInputs();const it=draft.items[+b.dataset.i];if(it){it.g=+it.g===+v?'':v;renderMealSheet()}break}
    case 'm-react':syncDraftInputs();draft.react=draft.react.includes(v)?draft.react.filter(x=>x!==v):draft.react.concat(v);draft.rAck=false;renderMealSheet();break;
    case 'm-save':saveMeal();break;
    case 'm-del':{const d=draft;if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Потвърди изтриването';return}
      const day=S.days[d._orig];if(day){day.meals=day.meals.filter(x=>x.id!==d.id);bump();saveDay(d._orig)}
      if(ASSETS)(d.photos||[]).concat(d._delPhotos||[]).forEach(id=>ASSETS.delete(id).catch(()=>{}));d._saved=true;
      closeSheet();render();toast('Изтрито');break}
    case 's-c':syncStool();draft.c=v;renderStoolSheet();break;
    case 's-col':syncStool();draft.col=v;renderStoolSheet();break;
    case 's-save':saveStool();break;
    case 's-del':{const d=draft;if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Потвърди изтриването';return}
      const day=S.days[d._orig];if(day){day.stools=(day.stools||[]).filter(x=>x.id!==d.id);bump();saveDay(d._orig)}closeSheet();render();toast('Изтрито');break}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='p-search'){UI.q=t.value;const pos=t.selectionStart;render();const n=$('#p-search');n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}return}
  if(t.id==='c-search'){UI.cq=t.value;const pos=t.selectionStart;render();const n=$('#c-search');n.focus();try{n.setSelectionRange(pos,pos)}catch(err){}return}
  if(t.id==='m-q'&&draft){draft._q=t.value;renderPick();return}
  if(t.dataset.gi!=null&&draft){draft.items[+t.dataset.gi].g=t.value;return}
  if(t.dataset.dn!=null&&draft){draft.items[+t.dataset.dn].n=t.value;return}
  if(t.dataset.act==='time'){S.profile.times=S.profile.times||{};S.profile.times[t.dataset.k]=t.value;const a=t.parentElement.querySelector('a');const k=t.dataset.k;const n=t.parentElement.querySelector('span').textContent;a.href=remLink(k,n,t.value)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='mark-mode'){UI.mark=e.target.checked;render()}
  if(e.target.id==='trend-sel'){UI.trend=e.target.value;render()}
  if(e.target.id==='age-sel'){UI.pa=e.target.value;render()}
  if(e.target.id==='m-date'&&draft&&!draft._recipe){syncDraftInputs();renderMealSheet()}
  if(e.target.dataset.ds!=null&&draft&&draft.items){draft.items[+e.target.dataset.ds].save=e.target.checked}
  if(e.target.id==='m-photo'&&draft&&ASSETS){
    const f=e.target.files[0];if(!f)return;const dr=draft;syncDraftInputs();dr._uploading=true;renderMealSheet();
    (async()=>{
      try{const blob=await compressImage(f);const type=/^image\/(jpeg|png|webp|gif)$/.test(blob.type)?blob.type:'image/jpeg';
        const r=await ASSETS.upload(blob,{type});dr.photos=(dr.photos||[]).concat(r.id);dr._newPhotos=(dr._newPhotos||[]).concat(r.id)}
      catch(err){toast(err&&err.code==='too_large'?'Снимката е твърде голяма':err&&err.code==='quota_or_state'?'Няма място за още снимки':'Снимката не се качи')}
      finally{dr._uploading=false;if(draft===dr){syncDraftInputs();renderMealSheet()}}
    })();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

let pendingImport=null;
$('#import-file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=='parvi-hapki')throw 0;pendingImport=d;
    const n=Object.keys(d.days||{}).length;const ks=MODE==='local'&&Array.isArray(d.kids)&&d.kids.length>1?d.kids:null;
    $('#import-confirm').innerHTML=`<div class="alert a-react" style="margin-top:10px"><div>${ks?`Файлът съдържа данни за <b>${ks.length} деца</b> (${ks.map(k=>h(k.name||'Бебе')).join(', ')}). Възстановяването ще <b>замени</b> данните на всички деца на този телефон.`:`Файлът съдържа <b>${n}</b> дни записи. Възстановяването ще <b>замени</b> всички сегашни данни${kidsList().length>1?` на ${h(S.profile.name||'това дете')}`:''}.`}</div><div class="row"><button class="btn sm danger" data-act="import-yes">Замени данните</button><button class="btn sm" data-act="import-no">Откажи</button></div></div>`;
  }catch(err){toast('Файлът не е копие от Първи хапки')}
});
async function applyImport(){
  const d=pendingImport;if(!d)return;pendingImport=null;
  if(d.photos&&MODE==='local'&&ASSETS){try{await LocalPhotos.importAll(d.photos)}catch(e){toast('Част от снимките не се възстановиха')}}
  // Копие с няколко деца (само на телефона): всяко дете в своя ключ, после активното
  if(MODE==='local'&&Array.isArray(d.kids)&&d.kids.length>1){
    d.kids.forEach(k=>{try{localStorage.setItem(lsKeyFor(k.id),JSON.stringify(k.data||{}))}catch(e){}});
    saveKids(d.kids.map(k=>({id:k.id,name:k.name,birth:k.birth})));
    if(!KIDS.some(k=>k.id===KID)){KID='main';try{localStorage.setItem('ph-kid','main')}catch(e){}}
    applyData(lsLoad());buildProducts();bump();render();toast(`Данните на ${d.kids.length} деца са възстановени`);return;
  }
  const old=Object.keys(S.days);
  S.profile=Object.assign(defProfile(),d.profile||{});S.prod=Object.assign({st:{},custom:[]},d.prod||{});S.days=d.days||{};
  S.growth=Object.assign({list:[]},d.growth||{});S.plan=Object.assign({days:{},shop:{}},d.plan||{});S.freezer=Object.assign({items:[]},d.freezer||{});
  buildProducts();bump();
  if(MODE==='db'){saveProfile();writeDoc('app/products',S.prod);saveGrowth();writeDoc('app/plan',S.plan);saveFreezer();old.forEach(k=>{if(!S.days[k])writeDoc('days/'+k,null)});Object.keys(S.days).forEach(k=>writeDoc('days/'+k,S.days[k]))}else lsSave();
  render();toast('Данните са възстановени');
}

init();
</script>
